[project]
name = "noa"
version = "0.1.0"
description = "Voice assistant with local speech models and natural turn-taking"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "kokoro-onnx>=0.5.0",
    "openai>=2.37.0",
    "bcrypt>=4.1.0",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.29",
    "soundfile>=0.13.1",
    "uvicorn[standard]>=0.47.0",
    "piper-tts>=1.4.2",
    "parakeet-mlx>=0.5.1",
    "anthropic>=0.107.0",
    "pysilero-vad>=3.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
