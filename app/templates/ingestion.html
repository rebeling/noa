{% extends "base.html" %}

{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&display=swap');

  /* htmx default uses opacity (still reserves layout space); collapse it
     to no-display when idle, flex while the request is in flight. */
  #upload-processing.htmx-indicator { display: none; }
  #upload-processing.htmx-request   { display: flex; }

  /* Centered column, matched to the noa page width. */
  .kb-wrap { max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
  .kb-title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 300; font-size: 1.9rem; letter-spacing: -.01em;
    text-align: center; color: #e8eef5; margin-bottom: .35rem;
  }
  .kb-sub {
    text-align: center; color: #7d8da3; font-size: .8rem;
    margin-bottom: 2rem;
  }
  .kb-card {
    background: rgba(18,24,38,.85);
    border: 1px solid rgba(160,200,220,.12);
    border-radius: 1rem;
    padding: 1.75rem;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
</style>
<div class="kb-wrap">
    <h1 class="kb-title">Knowledge Ingestion</h1>
    <p class="kb-sub">Upload a document to build the knowledge graph.</p>
    <div class="kb-card">

    <form hx-post="/api/v1/ingestion/upload" hx-encoding="multipart/form-data" hx-target="#upload-result"
          hx-headers='{"Authorization": "Bearer {{ admin_token }}"}'
          hx-indicator="#upload-processing" hx-disabled-elt="find button[type=submit]"
          hx-on::before-request="document.getElementById('upload-result').innerHTML=''">
        <div class="flex items-center justify-center w-full">
            <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-64 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span> or drag and drop</p>
                    <p class="text-xs text-gray-500">Plain Text (TXT)</p>
                    <p id="dropzone-name" class="mt-2 text-xs font-semibold text-blue-400"></p>
                </div>
                <input id="dropzone-file" name="file" type="file" class="hidden"
                       onchange="document.getElementById('dropzone-name').textContent = this.files[0] ? this.files[0].name : '';" />
            </label>
        </div>
        <button type="submit" class="mt-4 w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed">
            Upload & Ingest
        </button>
    </form>

    <!-- htmx-indicator: hidden until the upload request is in flight, then
         shown while Cognee cognifies (can take several seconds). -->
    <div id="upload-processing" class="htmx-indicator mt-4 flex items-center gap-3 p-4 text-sm text-blue-400 bg-blue-100 rounded-lg" role="status">
        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        Processing — building knowledge graph…
    </div>

    <button
        hx-post="/api/v1/ingestion/reset"
        hx-target="#upload-result"
        hx-headers='{"Authorization": "Bearer {{ admin_token }}"}'
        hx-confirm="Wipe ALL Cognee data (every tenant)? This cannot be undone."
        class="mt-3 w-full border border-red-400 text-red-500 hover:bg-red-500 hover:text-white font-bold py-2 px-4 rounded transition duration-150 ease-in-out">
        Clear Cognee DB
    </button>

    <div id="upload-result" class="mt-4"></div>
    </div>
</div>
{% endblock %}
