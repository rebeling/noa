{% extends "base.html" %}

{% block content %}
{# Dev-only JWT minted by views.voice_page — read by the WebSocket connect JS. #}
<meta name="ws-token" content="{{ ws_token }}">
<link rel="stylesheet" href="/static/voice.css">

<div class="noa-stage">

  <div class="debug-toggle" id="debug-toggle">DEBUG</div>
  <div class="debug-panel" id="debug-panel">
    <div class="debug-group">
      <div class="debug-label">Force State</div>
      <button class="debug-btn" onclick="setState('idle')">Idle</button>
      <button class="debug-btn" onclick="setState('waking')">Waking</button>
      <button class="debug-btn" onclick="setState('listening')">Listening</button>
      <button class="debug-btn" onclick="setState('processing')">Processing</button>
      <button class="debug-btn" onclick="setState('speaking')">Speaking</button>
      <button class="debug-btn" onclick="setState('error')">Error</button>
    </div>
    <div class="debug-group">
      <div class="debug-label">Transcript</div>
      <button class="debug-btn" onclick="mockMsg('user')">Mock User</button>
      <button class="debug-btn" onclick="mockMsg('assistant')">Mock Asst</button>
    </div>
    <div class="debug-group">
      <div class="debug-label">User: <b>{{ current_user }}</b> &middot; role: <b>{{ current_role }}</b></div>
      <input id="user-input" class="debug-field" type="text" value="{{ current_user }}" placeholder="user id">
      <select id="role-input" class="debug-field">
        <option value="admin" {% if current_role == 'admin' %}selected{% endif %}>admin</option>
        <option value="customer" {% if current_role == 'customer' %}selected{% endif %}>customer</option>
      </select>
      <button class="debug-btn" onclick="switchUser()">Switch</button>
    </div>
  </div>

  <div class="noa-wrap" id="isi" data-state="idle">
    <div class="halo-ring"></div>
    <div class="proc-ring"></div>
    <div class="halo"></div>

    <div class="core-sway">
      <div class="core" id="noa-core">
        <svg viewBox="0 0 200 200">
          <defs>
            <radialGradient id="plasma" cx="42%" cy="38%" r="72%">
              <stop offset="0%"  stop-color="#fffdf6"/>
              <stop offset="22%" stop-color="#c9f5ea"/>
              <stop offset="48%" stop-color="#7fe6d4"/>
              <stop offset="74%" stop-color="#3aa6c4"/>
              <stop offset="100%" stop-color="#163d61"/>
            </radialGradient>
          </defs>
          <path id="blob" class="blob-path" fill="url(#plasma)"
            d="M100,34 C136,34 166,64 166,100 C166,136 136,166 100,166 C64,166 34,136 34,100 C34,64 64,34 100,34 Z"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="noa-caption">
    <div class="sub" id="noa-sub">tap to wake</div>
  </div>

  <div class="transcript-drawer" id="transcript"></div>

  <div id="text-bar">
    <input id="text-input" type="text" autocomplete="off"
           placeholder="Tap the orb to connect, then type or speak…"
           onkeydown="if(event.key==='Enter')sendText(event)">
    <button class="debug-btn" onclick="sendText()">Send</button>
  </div>
</div>

<script src="/static/voice.js"></script>
{% endblock %}
